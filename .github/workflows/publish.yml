name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package extension
        run: pnpm --filter snapds run package

      - name: Get VSIX path
        id: vsix
        run: echo "path=$(ls extension/snapds-*.vsix | sort -V | tail -1)" >> $GITHUB_OUTPUT

      - name: Publish to VS Code Marketplace
        run: pnpm --filter snapds exec vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
